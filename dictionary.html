<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梦喻解梦 - 梦境词典</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="fixed top-0 left-0 right-0 bg-black bg-opacity-70 backdrop-blur-md z-50 border-b border-purple-900">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="text-2xl font-bold text-purple-400">梦喻解梦</div>
            <div class="hidden md:flex space-x-6">
                <a href="index.html" class="text-purple-300 hover:text-purple-100 transition-colors">首页</a>
                <a href="history.html" class="text-purple-300 hover:text-purple-100 transition-colors">梦境日记</a>
                <a href="dictionary.html" class="text-purple-300 hover:text-purple-100 transition-colors">梦境词典</a>
            </div>
            <div class="md:hidden">
                <button id="menu-toggle" class="text-purple-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
            </div>
        </div>
        <!-- 移动端菜单 -->
        <div id="mobile-menu" class="md:hidden hidden bg-black bg-opacity-90 backdrop-blur-md border-t border-purple-900">
            <div class="container mx-auto px-4 py-3 flex flex-col space-y-3">
                <a href="index.html" class="text-purple-300 hover:text-purple-100 transition-colors py-2">首页</a>
                <a href="history.html" class="text-purple-300 hover:text-purple-100 transition-colors py-2">梦境日记</a>
                <a href="dictionary.html" class="text-purple-300 hover:text-purple-100 transition-colors py-2">梦境词典</a>
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="container mx-auto px-4 pt-24 pb-16">
        <div class="max-w-4xl mx-auto">
            <!-- 标题 -->
            <div class="text-center mb-10">
                <h1 class="text-4xl md:text-5xl font-bold text-purple-300 mb-4">梦境词典</h1>
                <p class="text-purple-200 text-lg">常见梦境大全与解析</p>
            </div>

            <!-- 分类标签 -->
            <div class="flex flex-wrap gap-2 mb-8 justify-center">
                <button class="category-btn bg-purple-800/40 hover:bg-purple-700/60 text-purple-200 px-4 py-2 rounded-full text-sm transition-colors active" data-category="all">全部</button>
                <button class="category-btn bg-purple-800/40 hover:bg-purple-700/60 text-purple-200 px-4 py-2 rounded-full text-sm transition-colors" data-category="人物">人物</button>
                <button class="category-btn bg-purple-800/40 hover:bg-purple-700/60 text-purple-200 px-4 py-2 rounded-full text-sm transition-colors" data-category="动物">动物</button>
                <button class="category-btn bg-purple-800/40 hover:bg-purple-700/60 text-purple-200 px-4 py-2 rounded-full text-sm transition-colors" data-category="自然">自然</button>
                <button class="category-btn bg-purple-800/40 hover:bg-purple-700/60 text-purple-200 px-4 py-2 rounded-full text-sm transition-colors" data-category="场景">场景</button>
                <button class="category-btn bg-purple-800/40 hover:bg-purple-700/60 text-purple-200 px-4 py-2 rounded-full text-sm transition-colors" data-category="物品">物品</button>
                <button class="category-btn bg-purple-800/40 hover:bg-purple-700/60 text-purple-200 px-4 py-2 rounded-full text-sm transition-colors" data-category="行为">行为</button>
            </div>

            <!-- 词典内容 -->
            <div id="dictionary-content" class="space-y-6">
                <!-- 词条将通过JavaScript动态生成 -->
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-black bg-opacity-70 backdrop-blur-md border-t border-purple-900 py-6">
        <div class="container mx-auto px-4 text-center text-purple-400">
            <p>梦喻解梦 © 2026</p>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
